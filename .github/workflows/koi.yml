name: Git Profile Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi Profile
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi

      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --cached --quiet || git commit -m "Update Git Koi animation"
          git push
